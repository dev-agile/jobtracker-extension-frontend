<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section id="authView" class="popup auth-view">
      <header class="popup__header">
        <div class="popup__brand">
          <div class="bl-logo" aria-hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path
                d="M4 18 L8 12 L12 15 L16 8 L20 14"
                stroke="#14322a"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="popup__brand-text">
            <h1 class="popup__brand-name">Job<span>Track</span></h1>
            <p class="popup__brand-sub">Extension</p>
            <p class="subtitle">Sign in to sync applications with your team.</p>
          </div>
        </div>
        <button
          type="button"
          class="icon-btn open-fullscreen-btn"
          data-open-fullscreen
          title="Open full screen"
          aria-label="Open full screen"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </header>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab auth-tab--active" data-auth-tab="login">
          Sign in
        </button>
        <button type="button" class="auth-tab" data-auth-tab="invite">
          Accept invite
        </button>
      </div>

      <div data-auth-panel="login" class="auth-panel">
        <form id="loginForm" class="auth-form">
          <div id="authError" class="auth-error auth-error--hidden"></div>
          <label>
            Email
            <input name="email" type="email" required autocomplete="username" />
          </label>
          <label>
            Password
            <input name="password" type="password" required autocomplete="current-password" />
          </label>
          <button type="submit" class="primary-btn auth-submit">Sign in</button>
        </form>
        <p class="auth-footnote">
          Got an invite email? Use <strong>Accept invite</strong> once, then sign in here next time.
        </p>
      </div>

      <div data-auth-panel="invite" class="auth-panel auth-panel--hidden">
        <form id="inviteForm" class="auth-form">
          <div id="inviteError" class="auth-error auth-error--hidden"></div>
          <p id="invitePreview" class="auth-hint auth-hint--hidden"></p>
          <label>
            Invite link or token
            <input
              id="inviteToken"
              name="inviteToken"
              type="text"
              required
              placeholder="Paste link from your admin"
            />
          </label>
          <label>
            Display name (optional)
            <input name="displayName" type="text" autocomplete="name" />
          </label>
          <label>
            Password
            <input
              name="invitePassword"
              type="password"
              required
              minlength="8"
              autocomplete="new-password"
            />
          </label>
          <label>
            Confirm password
            <input
              name="invitePasswordConfirm"
              type="password"
              required
              minlength="8"
              autocomplete="new-password"
            />
          </label>
          <button type="submit" class="primary-btn auth-submit">Create account</button>
        </form>
      </div>
    </section>

    <section id="appView" class="popup app-view--hidden">
      <header class="popup__header">
        <div class="popup__brand">
          <div class="bl-logo" aria-hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path
                d="M4 18 L8 12 L12 15 L16 8 L20 14"
                stroke="#14322a"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="popup__brand-text">
            <h1 class="popup__brand-name">Job<span>Track</span></h1>
            <p class="subtitle">
              Signed in as <span id="userEmail" class="user-email"></span>
            </p>
          </div>
        </div>
        <div class="header-actions">
          <button
            type="button"
            class="icon-btn open-fullscreen-btn"
            data-open-fullscreen
            title="Open full screen"
            aria-label="Open full screen"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button id="refreshBtn" class="primary-btn" type="button">Sync</button>
          <button id="logoutBtn" class="secondary-btn" type="button">Sign out</button>
        </div>
      </header>

      <section class="meta-row" aria-label="Job stats">
        <div class="meta-pill">
          <span class="meta-pill__label">Total</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="meta-pill">
          <span class="meta-pill__label">Visible</span>
          <strong id="visibleCount">0</strong>
        </div>
      </section>

      <div class="controls">
        <label class="controls__field controls__field--search">
          <span class="controls__label">Search</span>
          <div class="controls__search-wrap">
            <input
              id="searchInput"
              type="text"
              placeholder="Role, company or URL..."
              class="controls__search"
            />
            <button id="clearSearchBtn" class="controls__clear-btn" type="button" aria-label="Clear search">
              Clear
            </button>
          </div>
        </label>
        <label class="controls__field controls__field--status">
          <span class="controls__label">Status</span>
          <select id="statusFilter" class="controls__select">
            <option value="all">All</option>
            <option value="applied">Applied</option>
            <option value="screening">Screening</option>
            <option value="interview">Interview</option>
            <option value="offer">Offer</option>
            <option value="rejected">Rejected</option>
            <option value="ghosted">Ghosted</option>
          </select>
        </label>
      </div>
      <div id="quickFilters" class="quick-filters" aria-label="Quick status filters"></div>

      <div id="banner" class="banner banner--hidden"></div>

      <div id="loader" class="loader">
        <span class="spinner"></span>
        <span>Loading jobs…</span>
      </div>

      <div id="jobsContainer" class="jobs"></div>
      <div id="emptyState" class="empty-state">
        <p>No jobs tracked yet.</p>
        <p class="hint">Open a job on Upwork and click “Save this job” to log it.</p>
      </div>

      <footer class="popup__footer">
        <button id="clearFiltersBtn" class="secondary-btn" type="button">
          Reset filters
        </button>
        <button id="clearLocalBtn" class="link-btn" type="button">
          Clear local cache
        </button>
      </footer>
    </section>

    <template id="jobCardTemplate">
      <article class="job-card">
        <div class="job-card__main">
          <div class="job-card__content">
            <div class="job-card__title-row">
              <a class="job-card__title" target="_blank" rel="noopener noreferrer"></a>
              <span class="job-card__status-pill"></span>
            </div>
            <div class="job-card__subline">
              <span class="job-card__company"></span>
              <div class="job-card__dates">
                <span class="job-card__date-line job-card__date-line--posted"></span>
                <span class="job-card__date-line job-card__date-line--applied"></span>
              </div>
            </div>
            <p class="job-card__details"></p>
            <a class="job-card__link" target="_blank" rel="noopener noreferrer">View job posting</a>
            <div class="job-card__skills-wrap">
              <p class="job-card__skills-title">Skills and expertise</p>
              <div class="job-card__skills"></div>
            </div>
          </div>
          <div class="job-card__facts"></div>
        </div>
        <div class="job-card__actions">
          <label class="job-card__status-label">
            Status
            <select class="job-card__select"></select>
          </label>
          <div class="job-card__action-spacer"></div>
          <button class="job-card__delete-btn" type="button">Delete</button>
        </div>
      </article>
    </template>

    <script type="module" src="../src/main.js"></script>
  </body>
</html>
